name: Live HTTPS smoke
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-service:
    runs-on: ubuntu-latest
    steps:
      - name: PWA is reachable without Vercel login
        run: |
          set -euo pipefail
          curl -fL -sS --retry 3 --retry-delay 3 --max-time 30 \
            "https://vibe-visual-forge-cloud.vercel.app/" -o /tmp/studio.html
          grep -qi 'VIBE VISUAL FORGE' /tmp/studio.html
      - name: API health from outside Vercel
        run: |
          set -euo pipefail
          curl -fL -sS --retry 3 --retry-delay 3 --max-time 30 \
            "https://vibe-visual-forge-cloud.vercel.app/api/health" -o /tmp/health.json
          python -c "import json; x=json.load(open('/tmp/health.json')); assert x['ok'] and x['service']=='vibe-visual-forge-cloud'; print(x)"
      - name: Streamable HTTP MCP tool discovery
        run: |
          set -euo pipefail
          curl -fL -sS --retry 3 --retry-delay 3 --max-time 30 \
            -X POST -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":42,"method":"tools/list"}' \
            "https://vibe-visual-forge-cloud.vercel.app/mcp" -o /tmp/mcp.json
          python -c "import json; x=json.load(open('/tmp/mcp.json')); names=[t['name'] for t in x['result']['tools']]; assert x['id']==42 and 'forge_ui_html' in names and 'forge_3d_scene_plan' in names; print(names)"
