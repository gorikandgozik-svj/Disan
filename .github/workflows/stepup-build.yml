name: StepUp Android build
on:
  push:
    branches: [stepup-android-build]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Expand staged Android sources
        run: base64 --decode stepup-src.b64 | xz --decompress | tar -xf -
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Validate Android APK signature and metadata
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 25
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 3
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: StepUp-Android-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-smoke:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 22
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: StepUp-Android-Debug-APK
          path: build-output
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install APK and check app activity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r build-output/app-debug.apk
            adb shell am start -W -n com.stepup.tracker/.MainActivity
            sleep 3
            echo '--- StepUp 3-second process state ---'
            adb shell ps -A | grep -Ei 'stepup|webview' || true
            adb shell dumpsys activity activities | grep -Ei 'stepup|resumed|mCurrentFocus' | tail -n 20 || true
            sleep 5
            echo '--- Full system issues ---'
            adb logcat -d -v time | grep -Ei -C 3 'stepup|chromium|webview|lowmemory|am_kill|am_proc_died|force finishing|killing|crash|signal 11|fatal' | tail -n 260 || true
            echo '--- Android crash buffer ---'
            adb logcat -d -b crash | tail -n 150
            echo '--- AndroidRuntime errors ---'
            adb logcat -d -s AndroidRuntime:E | tail -n 120
            PID=$(adb shell pidof com.stepup.tracker | tr -d '\r')
            echo "Process PID: $PID"
            adb shell screencap -p /sdcard/stepup.png
            adb pull /sdcard/stepup.png emulator-stepup.png
            test -n "$PID"
      - name: Save emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StepUp-emulator-screenshot
          path: emulator-stepup.png
          if-no-files-found: ignore
