name: Publish v1.1.0 release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "Release v1.1.0 already exists."
            exit 0
          fi
          gh release create v1.1.0 --target "${GITHUB_SHA}" --title "VIBE VISUAL FORGE 1.1.0" --notes-file RELEASE_NOTES.md
